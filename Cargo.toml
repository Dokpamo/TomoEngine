[workspace]
members = ["crates/tomo-physics", "crates/tomo-scene", "crates/tomo-runtime", "crates/tomo-render", "tools/tomo-cli", "tools/tomo-play"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Dokpamo/TomoEngine"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
overflow-checks = true
