repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
tomo-play = { path = "../tomo-play" }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "android-native-activity"] }
