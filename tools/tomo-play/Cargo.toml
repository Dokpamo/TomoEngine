[package]
name = "tomo-play"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
tomo-scene = { path = "../../crates/tomo-scene" }
tomo-runtime = { path = "../../crates/tomo-runtime" }
tomo-render = { path = "../../crates/tomo-render" }
