[package]
name = "tomo-play"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
tomo-game = { path = "../../crates/tomo-game" }
tomo-project = { path = "../../crates/tomo-project" }
tomo-scene = { path = "../../crates/tomo-scene" }
tomo-render = { path = "../../crates/tomo-render" }
serde_json.workspace = true
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[features]
default = []
fma = ["tomo-game/fma"]
