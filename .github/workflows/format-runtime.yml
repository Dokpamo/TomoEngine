name: Format runtime branch
on:
  push:
    branches: [feat/jolt-rust-foundation]
permissions:
  contents: write
concurrency:
  group: format-runtime-branch
  cancel-in-progress: false
jobs:
  format-and-test:
    if: github.repository == 'Dokpamo/TomoEngine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
      - name: Install Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - name: Apply mechanical lint fixes and formatting
        run: |
          cargo +1.85.0 clippy --fix --allow-dirty --allow-staged --workspace --all-targets --all-features --locked --offline -- -D warnings
          cargo +1.85.0 fmt --all
          if ! git diff --quiet -- crates; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add crates
            git commit -m 'style: apply mechanical Clippy fixes and rustfmt'
            git push origin HEAD:feat/jolt-rust-foundation
          fi
          git rev-parse HEAD
      - name: Default tests
        run: cargo +1.85.0 test --workspace --locked --offline
      - name: Feature tests
        if: always()
        run: cargo +1.85.0 test --workspace --all-features --locked --offline
      - name: Release tests
        if: always()
        run: cargo +1.85.0 test --workspace --release --all-features --locked --offline
      - name: Clippy
        if: always()
        run: cargo +1.85.0 clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
      - name: Falling box
        if: always()
        run: cargo +1.85.0 run -p tomo-physics --example falling_box --release --locked --offline
      - name: Stack
        if: always()
        run: cargo +1.85.0 run -p tomo-physics --example stack --release --locked --offline
