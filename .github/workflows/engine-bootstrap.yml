name: Engine dependency bootstrap
on:
  push:
    branches: [feat/ai-first-engine-foundation]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install tools
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt
      - name: Resolve lockfile for explicit review
        run: |
          cargo +1.85.0 generate-lockfile
          echo TOMO_LOCK_BEGIN
          cat Cargo.lock
          echo TOMO_LOCK_END
      - name: Tests
        run: cargo +1.85.0 test --workspace --all-features --locked
      - name: Release tests
        if: always()
        run: cargo +1.85.0 test --workspace --release --all-features --locked
      - name: Clippy
        if: always()
        run: cargo +1.85.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Format
        if: always()
        run: cargo +1.85.0 fmt --all -- --check
