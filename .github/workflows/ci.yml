name: Rust engine

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: '1.85.0'
          - os: windows-latest
            toolchain: '1.85.0'
          - os: macos-latest
            toolchain: '1.85.0'
          - os: ubuntu-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Fetch reviewed locked dependencies
        run: cargo +${{ matrix.toolchain }} fetch --locked
      - name: Default tests
        run: cargo +${{ matrix.toolchain }} test --workspace --locked --offline
      - name: FMA tests
        run: cargo +${{ matrix.toolchain }} test --workspace --all-features --locked --offline
      - name: Release default tests
        run: cargo +${{ matrix.toolchain }} test --workspace --release --locked --offline
      - name: Release FMA tests
        run: cargo +${{ matrix.toolchain }} test --workspace --release --all-features --locked --offline
      - name: Physics query example
        run: cargo +${{ matrix.toolchain }} run -p tomo-physics --example raycast --locked --offline
      - name: Physics falling box
        run: cargo +${{ matrix.toolchain }} run -p tomo-physics --example falling_box --release --locked --offline
      - name: Physics stack
        run: cargo +${{ matrix.toolchain }} run -p tomo-physics --example stack --release --locked --offline
      - name: Actual JSON scene acceptance
        run: cargo +${{ matrix.toolchain }} run -q -p tomo-cli --locked --offline -- run examples/scenes/falling_box.scene.json --ticks 600
      - name: Project creation and standalone game acceptance
        run: |
          cargo +${{ matrix.toolchain }} run -q -p tomo-cli --locked --offline -- project new target/ci-game --name "CI Game"
          cargo +${{ matrix.toolchain }} run -q -p tomo-cli --locked --offline -- project validate target/ci-game
          cargo +${{ matrix.toolchain }} run -q -p tomo-play --locked --offline -- --project target/ci-game --replay examples/replays/box_run_win.replay.json
      - name: Compiled Rust SDK game acceptance
        run: cargo +${{ matrix.toolchain }} run -q -p tomo-sdk-demo --locked --offline -- --headless
      - name: Tool transaction and SDK selection tests
        run: |
          python3 scripts/test-code-edit.py
          python3 scripts/test-packaging.py
      - name: Box Run fixed input acceptance
        run: cargo +${{ matrix.toolchain }} run -q -p tomo-play --locked --offline -- --replay examples/replays/box_run_win.replay.json
      - name: Authored logic project acceptance
        run: cargo +${{ matrix.toolchain }} run -q -p tomo-play --locked --offline -- --project examples/projects/logic_lab --replay examples/replays/logic_lab_timeout.replay.json

  quality:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned quality tools
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Fetch reviewed locked dependencies
        run: cargo +1.85.0 fetch --locked
      - name: Format
        run: cargo +1.85.0 fmt --all -- --check
      - name: Clippy
        if: always()
        run: cargo +1.85.0 clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
      - name: Documentation
        if: always()
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.85.0 doc --workspace --no-deps --all-features --locked --offline
      - name: Crate boundaries and physics purity
        if: always()
        run: python3 scripts/check-policy.py

  gpu-capture:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust and software Vulkan adapter
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers xvfb libxkbcommon-x11-0
      - name: Install Linux audio headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Fetch reviewed locked dependencies
        run: cargo +1.85.0 fetch --locked
      - name: Actual Vulkan pixels and capture process
        env:
          XDG_RUNTIME_DIR: /tmp
        run: |
          cargo +1.85.0 test -p tomo-render --locked --offline --test capture -- --ignored
          cargo +1.85.0 test -p tomo-render --locked --offline --test content -- --ignored
          cargo +1.85.0 test -p tomo-cli --features render --locked --offline --test cli -- --ignored
          cargo +1.85.0 test -p tomo-play --locked --offline -- --ignored
      - name: Actual desktop surface, movement and resize
        env:
          XDG_RUNTIME_DIR: /tmp
          WINIT_UNIX_BACKEND: x11
        run: xvfb-run -a cargo +1.85.0 run -p tomo-play --locked --offline -- --smoke-test

      - name: Actual editor panels, viewport, play isolation and resize
        env:
          XDG_RUNTIME_DIR: /tmp
          WINIT_UNIX_BACKEND: x11
        run: xvfb-run -a cargo +1.85.0 run -p tomo-editor --locked --offline -- --smoke-test

  android-package:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust target
        run: rustup toolchain install 1.85.0 --profile minimal --target aarch64-linux-android
      - name: Fetch reviewed dependencies
        run: cargo +1.85.0 fetch --locked
      - name: Build local test APK with the runner Android SDK
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          python3 scripts/package-game.py --project examples/projects/creator_lab --platform android --output target/ci-android --debug
