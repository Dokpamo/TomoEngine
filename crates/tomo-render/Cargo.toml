[package]
name = "tomo-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
editor = ["dep:egui"]

[dependencies]
egui = { version = "=0.32.3", optional = true }
tomo-scene = { path = "../tomo-scene" }
tomo-runtime = { path = "../tomo-runtime" }
serde.workspace = true
wgpu = { version = "=26.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }
pollster = "=0.4.0"
png = "=0.17.16"

[dev-dependencies]
serde_json.workspace = true
